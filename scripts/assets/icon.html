<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Zdroj ikon (stejný motiv jako public/favicon.svg): zlatý dům se znakem dolaru na modrém
         čtverci – nemovitost a její cena. Okraje domu leží na mřížce po čtyřech jednotkách, aby byly
         ostré i v 16 px. Znak má místo svislé čáry jen krátké čárky nahoře a dole, jinak se v malé
         velikosti slije.
         ?square = plné čtvercové pozadí pro apple-touch-icon (iOS si rohy zakulatí sám). -->
    <style>
      * { margin: 0; }
      html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
      svg { display: block; width: 512px; height: 512px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="#1d4c84" id="pozadi"/>
      <path fill="#f4b740" stroke="#f4b740" stroke-width="3" stroke-linejoin="round" d="M32 9.5 7.5 30.5h6v24h37v-24h6z"/>
      <path fill="none" stroke="#1d4c84" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" d="M37.95 29.48c-0.51 -2.8 -2.8 -4.67 -5.95 -4.67 -3.4 0 -5.95 1.95 -5.95 4.93 0 3.06 2.38 4.17 5.95 5.27s5.95 2.29 5.95 5.27c0 2.98 -2.55 4.93 -5.95 4.93 -3.15 0 -5.44 -1.87 -5.95 -4.67"/>
      <path fill="none" stroke="#1d4c84" stroke-width="4" stroke-linecap="round" d="M32 21.82V24.8M32 45.2v2.98"/>
    </svg>
    <script>
      if (location.search.includes('square')) document.getElementById('pozadi').setAttribute('rx', '0');
    </script>
  </body>
</html>
