<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Zdroj ikon (stejný motiv jako public/favicon.svg): zlatá parcela na modrém výkresu.
         ?square = plné čtvercové pozadí pro apple-touch-icon (iOS si rohy zakulatí sám). -->
    <style>
      * { margin: 0; }
      html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
      svg { display: block; width: 512px; height: 512px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="tvar"><rect id="bg-clip" width="64" height="64" rx="14" /></clipPath>
      </defs>
      <g clip-path="url(#tvar)">
        <rect width="64" height="64" fill="#1d4c84" />
        <g transform="rotate(-16 32 32)">
          <path d="M-12 19h88M-12 45h88M11 19v26M53 19v26M-2 -8v27M26 -8v27M40 45v28M64 45v28" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2.5" />
          <rect x="19" y="19" width="26" height="26" fill="#f4b740" />
        </g>
      </g>
    </svg>
    <script>
      if (location.search.includes('square')) document.getElementById('bg-clip').setAttribute('rx', '0');
    </script>
  </body>
</html>
